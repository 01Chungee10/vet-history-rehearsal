<main>
  <div class="titlebar"><div><h1>해외 직업교육훈련의 역사</h1><p>독일 · 호주 · 미국의 숙련 형성과 기술 변화</p></div></div>
  <div class="toolbar" aria-label="슬라이드 탐색">
    <div class="counter"><span>발표 순서</span><strong id="counter">01 / 29</strong></div>
    <label class="picker"><span class="sr">이동할 슬라이드 선택</span><select id="picker" disabled><option>슬라이드 불러오는 중…</option></select></label>
    <div class="pager"><button id="prev" type="button" disabled><span aria-hidden="true">←</span> 이전</button><button id="next" type="button" disabled>다음 <span aria-hidden="true">→</span></button></div>
  </div>
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>
  <p class="sr" aria-live="polite" id="announce"></p>

        <a id="open-source" target="_blank" rel="noopener">자료 열기 <span aria-hidden="true">↗</span></a>
      </article>
      <aside class="prompt"><h3>대본을 덮고 답해 보기</h3><p id="question"></p></aside>
    </section>
  </div>
</main>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer-top"><strong id="viewer-title"></strong><button id="close" type="button">닫기 <span aria-hidden="true">×</span></button></div><img id="large-img" width="1440" height="810" alt=""></dialog>
